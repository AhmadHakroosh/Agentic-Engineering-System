name: Build and Stage Immutable Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build once
        run: python3 scripts/run_configured_checks.py build
      - name: Package deterministically
        run: |
          test -d dist
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf release.tgz dist
      - name: Record digest
        id: digest
        run: echo "digest=sha256:$(sha256sum release.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Store release artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-${{ github.sha }}
          path: release.tgz
          if-no-files-found: error
          retention-days: 30

  staging:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-${{ github.sha }}
      - name: Verify artifact
        env:
          EXPECTED: ${{ needs.build.outputs.digest }}
        run: test "$EXPECTED" = "sha256:$(sha256sum release.tgz | cut -d' ' -f1)"
      - name: Deploy immutable artifact to staging
        run: |
          echo "Replace this step with a reviewed staging adapter."
          echo "commit=${GITHUB_SHA} digest=${{ needs.build.outputs.digest }}"
      - name: Verify staging
        run: echo "Replace this step with deterministic smoke and health checks."
      - name: Publish promotion evidence
        run: |
          mkdir -p promotion
          printf '%s\n' '${{ github.sha }}' > promotion/commit-sha
          printf '%s\n' '${{ needs.build.outputs.digest }}' > promotion/artifact-digest
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: promotion-${{ github.sha }}
          path: promotion
          if-no-files-found: error
          retention-days: 30

