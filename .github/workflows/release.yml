name: Build and Stage Immutable Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Build once
        run: python3 scripts/run_configured_checks.py build
      - name: Resolve configured artifact path
        id: artifact
        run: |
          path="$(python3 -c 'import json; print(json.load(open("delivery.config.json"))["release"]["artifactPath"])')"
          test -n "$path"
          test "${path#/}" = "$path"
          case "/$path/" in *"/../"*) exit 1 ;; esac
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Package deterministically
        env:
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          test -d "$ARTIFACT_PATH"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf release.tgz "$ARTIFACT_PATH"
      - name: Record digest
        id: digest
        run: echo "digest=sha256:$(sha256sum release.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Store release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: release.tgz
          if-no-files-found: error
          retention-days: 30

  staging:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
      - name: Verify artifact
        env:
          EXPECTED: ${{ needs.build.outputs.digest }}
        run: test "$EXPECTED" = "sha256:$(sha256sum release.tgz | cut -d' ' -f1)"
      - name: Deploy immutable artifact to staging
        run: |
          echo "Replace this step with a reviewed staging adapter."
          echo "commit=${{ github.event.workflow_run.head_sha }} digest=${{ needs.build.outputs.digest }}"
      - name: Verify staging
        run: echo "Replace this step with deterministic smoke and health checks."
      - name: Publish promotion evidence
        run: |
          mkdir -p promotion
          printf '%s\n' '${{ github.event.workflow_run.head_sha }}' > promotion/commit-sha
          printf '%s\n' '${{ needs.build.outputs.digest }}' > promotion/artifact-digest
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: promotion-${{ github.event.workflow_run.head_sha }}
          path: promotion
          if-no-files-found: error
          retention-days: 30
